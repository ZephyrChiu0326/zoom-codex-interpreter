name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ZIP archives
        run: python3 scripts/build_release.py

      - name: Build Git bundle
        run: git bundle create "dist/ZoomCodexInterpreter-${GITHUB_REF_NAME}.bundle" --all

      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
